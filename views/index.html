<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Monster Mayhem</title>

    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <h1>Monster Mayhem</h1>

    <section id="game-status">
        <p>
            <strong id="player-identity">
                Connecting...
            </strong>
        </p>

        <p id="connection-status">
            Waiting for server...
        </p>

        <p>
            Round:
            <strong id="round-number">1</strong>
        </p>

        <p>
            Current turn:
            <strong id="current-player">
                Simultaneous turns
            </strong>
        </p>

        <div id="player-scores">
            <section class="player-panel player-one-panel">
                <h2>Player 1</h2>

                <p>
                    Status:
                    <strong id="player-one-status">
                        Choosing
                    </strong>
                </p>

                <p>
                    Monsters remaining:
                    <strong id="player-one-score">
                        10
                    </strong>
                </p>
            </section>

            <section class="player-panel player-two-panel">
                <h2>Player 2</h2>

                <p>
                    Status:
                    <strong id="player-two-status">
                        Choosing
                    </strong>
                </p>

                <p>
                    Monsters remaining:
                    <strong id="player-two-score">
                        10
                    </strong>
                </p>
            </section>
        </div>

        <section id="game-statistics">
            <h2>Game Statistics</h2>

            <p>
                Battles:
                <strong id="battle-count">0</strong>
            </p>

            <p>
                Player 1 eliminations:
                <strong id="player-one-eliminations">
                    0
                </strong>
            </p>

            <p>
                Player 2 eliminations:
                <strong id="player-two-eliminations">
                    0
                </strong>
            </p>
        </section>

        <section id="game-over-panel">
            <h2 id="game-result"></h2>

            <button
                id="play-again-button"
                type="button"
                hidden
            >
                Play Again
            </button>
        </section>
    </section>

    <div id="game-board"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/modules/game.js"></script>
    <script src="/modules/board.js"></script>
    <script src="/modules/monsters.js"></script>
    <script src="/main.js"></script>
</body>
</html>
